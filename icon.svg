<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
    <defs>
        <!-- Self-contained drop shadow for 3D depth -->
        <filter id="ribbon-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
        </filter>

        <!-- Sunset Optimization Dark (Front/Inner Faces) -->
        <linearGradient id="front-sunset" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#b45309"/>
        </linearGradient>

        <!-- Sunset Optimization Light (Top Highlights) -->
        <linearGradient id="top-sunset" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fcd34d"/>
            <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
    </defs>

    <!-- Grouped to ensure the drop shadow applies to the entire rounded shape -->
    <g filter="url(#ribbon-shadow)">
        
        <!-- Main 'M' Ribbon Body -->
        <path d="M50,190 L50,90 L90,60 L128,110 L166,60 L206,90 L206,190 L166,160 L166,110 L128,160 L90,110 L90,160 Z" 
              fill="url(#front-sunset)" 
              stroke="url(#front-sunset)"
              stroke-width="6"
              stroke-linejoin="round"/>

        <!-- Left Top Fold Highlight -->
        <path d="M50,90 L90,60 L128,110 L90,110 Z" 
              fill="url(#top-sunset)"
              stroke="url(#top-sunset)"
              stroke-width="6"
              stroke-linejoin="round"/>

        <!-- Right Top Fold Highlight -->
        <path d="M206,90 L166,60 L128,110 L166,110 Z" 
              fill="url(#top-sunset)"
              stroke="url(#top-sunset)"
              stroke-width="6"
              stroke-linejoin="round"/>
              
    </g>
</svg>